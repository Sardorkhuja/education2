/** Supabase's public REST/Auth endpoints. No service-role or secret key is used here. */
class CloudClient {
  constructor(config) {
    this.url=(config.supabaseUrl||'').replace(/\/$/,'');this.key=config.supabasePublishableKey||'';
    this.authKey=`education-auth:${this.url}`;this.session=null;this.refreshPromise=null;
    if (this.key.startsWith('sb_secret_')) throw new Error('A secret Supabase key must never be used in a browser.');
    if (this.key.startsWith('eyJ')) {try{if(JSON.parse(atob(this.key.split('.')[1])).role==='service_role')throw new Error('service_role keys are not safe in a browser.');}catch(e){if(e.message.includes('service_role'))throw e;}}
    try {this.session=JSON.parse(localStorage.getItem(this.authKey)||'null');}catch{}
  }
  get configured(){return !!this.url && !!this.key;}
  get user(){return this.session?.user||null;}
  remember(session) {
    if (session && !session.expires_at) session.expires_at=Math.floor(Date.now()/1000)+(session.expires_in||3600);
    this.session=session;
    if(session)localStorage.setItem(this.authKey,JSON.stringify(session));else localStorage.removeItem(this.authKey);
  }
  async request(path,{method='GET',body,token,headers={}}={}) {
    const response=await fetch(`${this.url}${path}`,{method,headers:{apikey:this.key,...(token?{Authorization:`Bearer ${token}`}:{ }),'Content-Type':'application/json',...headers},...(body!==undefined?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(25000),cache:'no-store'});
    const text=await response.text();let result;try{result=text?JSON.parse(text):null;}catch{throw new Error('The cloud returned an invalid response. Your local data is safe.');}
    if(!response.ok) {const error=new Error(result?.msg||result?.message||result?.error_description||result?.error||`Cloud request failed (${response.status}).`);error.status=response.status;throw error;}
    return result;
  }
  async signIn(email,password) {
    const session=await this.request('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password}});
    this.remember(session);return session.user;
  }
  async token() {
    if(!this.session)throw new Error('Sign in to sync this workspace.');
    if(this.session.expires_at>Date.now()/1000+90)return this.session.access_token;
    if(this.refreshPromise)return this.refreshPromise;
    const refresh=async()=>{
      try {this.session=JSON.parse(localStorage.getItem(this.authKey)||'null')||this.session;}catch{}
      if(this.session?.expires_at>Date.now()/1000+90)return this.session.access_token;
      const session=await this.request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:this.session.refresh_token}});
      this.remember(session);return session.access_token;
    };
    this.refreshPromise=('locks' in navigator?navigator.locks.request(`education-auth:${this.url}`,refresh):refresh()).finally(()=>{this.refreshPromise=null;});
    return this.refreshPromise;
  }
  async signOut() {
    if(this.session && navigator.onLine) {try{await this.request('/auth/v1/logout?scope=local',{method:'POST',token:await this.token()});}catch{}}
    this.remember(null);
  }
  async resetPassword(email) {await this.request('/auth/v1/recover?redirect_to='+encodeURIComponent(location.href.split('#')[0]),{method:'POST',body:{email}});}
  async updatePassword(password) {await this.request('/auth/v1/user',{method:'PUT',token:await this.token(),body:{password}});}
  async acceptRecovery() {
    const params=new URLSearchParams(location.hash.slice(1));
    if(params.get('type')!=='recovery'||!params.get('access_token'))return false;
    const token=params.get('access_token');
    const user=await this.request('/auth/v1/user',{token});
    this.remember({user,access_token:token,refresh_token:params.get('refresh_token'),expires_in:+params.get('expires_in')||3600});
    history.replaceState(null,'',location.pathname+location.search);return true;
  }
  async listRecords() {
    const rows=[];let offset=0;
    while(true) {
      const batch=await this.request(`/rest/v1/education_records?select=*&order=id.asc&offset=${offset}&limit=500`,{token:await this.token()});
      rows.push(...batch);if(batch.length<500)break;offset+=500;
      if(offset>20000)throw new Error('Workspace is too large to sync in one session.');
    }
    return rows;
  }
  async save(record) {
    return await this.request('/rest/v1/rpc/save_education_record',{method:'POST',token:await this.token(),body:{p_id:record.id,p_kind:record.kind,p_data:record.data,p_expected_revision:record.revision,p_deleted:record.deleted,p_mutation_id:record.mutationId}});
  }
}


// ---- sync.js ----
class SyncEngine {
  constructor(store,cloud,onStatus) {this.store=store;this.cloud=cloud;this.onStatus=onStatus;this.running=false;this.timer=null;this.status='Local only';this.lastSync=null;}
  statusChanged(text,error=false){this.status=text;this.onStatus?.(text,error);}
  schedule(){clearTimeout(this.timer);this.timer=setTimeout(()=>this.run(),900);}
  async run() {
    if(this.running)return;
    if(!this.cloud.user || this.store.account==='local'){this.statusChanged('Local only');return;}
    if(!navigator.onLine){this.statusChanged('Offline');return;}
    const account=this.store.account;
    this.running=true;this.statusChanged('Syncing');
    const operation=async()=>{
      if(this.cloud.user?.id!==account)return;
      // Push the persistent outbox first. Server-side compare-and-swap detects stale-device edits.
      for(const record of [...this.store.pending]) {
        if(this.store.account!==account) return;
        const response=await this.cloud.save(record);
        if(response.ok)await this.store.acknowledge(record,response.record,account);
        else await this.store.flagConflict(record.id,response.record,account);
      }
      if(this.store.account!==account)return;
      const rows=await this.cloud.listRecords();
      if(this.store.account!==account)return;
      await this.store.applyRemote(rows,account);
      this.lastSync=new Date();this.error=null;
      this.statusChanged(this.store.conflicts.length?'Review changes':this.store.pending.length?'Changes pending':'Up to date');
    };
    try {
      if('locks' in navigator)await navigator.locks.request(`education-sync:${account}`,async()=>{await this.store.load(account);await operation();});
      else await operation();
    } catch(error) {this.error=error.message;this.statusChanged(error.status===401||error.status===400?'Sign in again':'Sync unavailable',true);}
    finally {this.running=false;if(!this.error && this.store.pending.length && this.store.account===account)this.schedule();}
  }
}

  const sidebar=`<aside class="sidebar" aria-label="Sidebar"><div class="brand"><div class="brand-icon">${icon('book',24)}</div><div><div class="brand-name">Education</div><small>Your semester, together.</small></div></div><nav class="nav-list" aria-label="Main navigation">${NAV.map(([v,i,label])=>`<button class="nav-item ${state.view===v||v==='courses'&&state.view==='course'?'active':''}" data-action="navigate" data-id="${v}" ${state.view===v?'aria-current="page"':''}>${icon(i,20)}<span>${label}</span>${v==='courses'?`<span class="nav-count">${list.length}</span>`:''}</button>`).join('')}</nav><div class="sidebar-section"><div class="sidebar-heading"><span class="caption">My courses</span>${iconButton('plus','Add a course','new-course')}</div>${list.map(c=>`<button class="sidebar-course ${colorOf(c)}" data-action="course" data-id="${e(c.id)}"><span class="course-dot"></span><span>${e(c.shortName||c.name)}</span></button>`).join('')}</div><div class="sidebar-bottom"><div class="university-mini">${icon('cap',20)}<span>${e(p.university)}<br>${e(p.term)}</span></div><button class="sync-chip ${sync.status==='Local only'?'local':sync.status==='Up to date'?'':'error'}" data-action="navigate" data-id="settings">${icon(sync.status==='Up to date'?'cloudCheck':'cloud',17)}<span>${e(sync.status)}</span><span class="sync-dot"></span></button></div></aside>`;
  const tabbar=`<nav class="bottom-tabs" aria-label="Tab bar">${NAV.map(([v,i,l])=>`<button data-action="navigate" data-id="${v}" class="${state.view===v||state.view==='course'&&v==='courses'?'active':''}" ${state.view===v?'aria-current="page"':''}>${icon(i,22)}<span>${l}</span></button>`).join('')}</nav>`;
  const top=`<header class="topbar"><div class="topbar-label">${e(formatDate(today(),{weekday:'long',day:'numeric',month:'long'}))}<span class="desktop-only"> &nbsp; / &nbsp; ${e(p.term)}</span></div><div class="topbar-actions">${iconButton('search','Search (Command K)','search')}<button class="primary" data-action="new-menu" aria-label="Add a new item">${icon('plus',17)}<span>Add new</span></button><button class="avatar" data-action="navigate" data-id="settings" aria-label="Settings">${e(name.slice(0,1).toUpperCase())}</button></div></header>`;
  let content='';
  if(state.view==='schedule')content=renderSchedule();
  else if(state.view==='tasks')content=renderTasks();
  else if(state.view==='exams')content=renderExams();
  else if(state.view==='courses')content=renderCourses();
  else if(state.view==='course')content=renderCourse();
  else if(state.view==='grades')content=renderGrades();
  else content=renderSettings();
  root.innerHTML=`<div class="app-layout">${sidebar}<div class="main-shell">${top}<main id="main" tabindex="-1">${content}</main></div>${tabbar}</div>`;
}
function introHTML(){return `<div class="welcome-intro"><div class="brand-icon">${icon('book',40)}</div><h1>A little clarity.<br>A better<br>semester.</h1><p>Classes, deadlines and grades.<br>One thoughtful space for university life.</p><div class="welcome-features"><div class="welcome-feature">${icon('calendar',22)} A week you can see at a glance.</div><div class="welcome-feature">${icon('chart',22)} Every grade. The whole picture.</div><div class="welcome-feature">${icon('lock',22)} Your workspace. Your data.</div></div></div>`;}
function renderWelcome(){const p=defaultProfile();return `<div class="welcome">${introHTML()}<section class="card welcome-panel"><h2>Welcome to Education</h2><p>Make it yours. Everything can be changed later.</p><form id="welcome-form">${field('Your first name (optional)','name','','text','autocomplete="given-name"')}${field('University','university',p.university,'text','required maxlength="200"')}${field('Semester','term',p.term,'text','required maxlength="80"')}<div class="form-grid">${field('Starts','startDate',p.startDate,'date','required')}${field('Ends','endDate',p.endDate,'date','required')}</div>${field('University time zone','timeZone',p.timeZone,'text','required')}<button class="primary" type="submit">Set up my courses ${icon('arrow',17)}</button><div id="welcome-error" class="form-error" hidden></div></form><p class="privacy-note">${cloud.user?'Signed in. Your workspace can sync across devices.':'Local workspace. Connect Supabase after deployment to sync devices.'}<br>No grades or completed tasks are invented.</p></section></div>`;}
function renderAuth(){return `<div class="welcome">${introHTML()}<section class="card welcome-panel"><h2>Your semester awaits.</h2><p>Sign in with your Education account to pick up where you left off.</p><form id="auth-form">${field('Email','email','','email','required autocomplete="username"')}${field('Password','password','','password','required autocomplete="current-password"')}<button class="primary" type="submit">Sign in ${icon('arrow',17)}</button><div id="auth-error" class="form-error" hidden></div></form><button class="text-button" data-action="forgot-password">Forgot password?</button><p class="privacy-note">For a private personal deployment, create your account in Supabase Authentication first.</p><button class="text-button" data-action="local-mode">Use on this device only</button></section></div>`;}
function weekClasses(){return entities('class').flatMap(s=>occurrences(s,state.week,addDays(state.week,6)));}
function renderCalendarEvent(item,isDeadline=false){const c=courseById(item.courseId);const mode=modeData(item,c);return `<button class="calendar-event ${colorOf(c)} ${isDeadline?'deadline':''}" data-action="${isDeadline?'edit-item':'occurrence'}" data-id="${e(item.id)}" ${isDeadline?'':`data-date="${item.date}"`}><span class="event-time">${isDeadline?e(item.due?.time||'Deadline'):e(item.time||'Time to confirm')}</span><strong>${e(c?.shortName||c?.name)}</strong><span class="event-mode">${icon(isDeadline?'flag':mode.icon,12)}${e(isDeadline?item.title:mode.mode==='in-person'?(mode.location||'On campus'):mode.label)}</span>${isDeadline&&!item.due?.confirmed?`<span class="event-time" style="margin-top:6px">Tentative</span>`:''}</button>`;}
function renderAgenda(classes){const day=state.day;const events=classes.filter(s=>s.date===day).map(s=>({...s,category:'class'}));const deadlines=allItems().filter(x=>!isDone(x)&&dueOn(x.due,day)).map(x=>({...x,category:'deadline'}));const list=[...events,...deadlines].sort((a,b)=>(a.time||a.due?.time||'99').localeCompare(b.time||b.due?.time||'99'));
  return `<div class="mobile-agenda"><div class="agenda-day-title"><h2>${day===today()?'Today':e(formatDate(day,{weekday:'long'}))}</h2><span>${list.length} ${list.length===1?'item':'items'}</span></div><div class="day-agenda">${list.length?list.map(item=>{const c=courseById(item.courseId);const mode=modeData(item,c);return `<div class="card agenda-row ${colorOf(c)}"><div class="agenda-time">${e(item.category==='class'?(item.time||'Time TBC'):(item.due.time||'Due today'))}<small>${e(item.category==='class'?(item.endTime||''):item.due.confirmed?'Deadline':'Tentative')}</small></div><div class="agenda-card-main"><button class="row-title-button" data-action="${item.category==='class'?'occurrence':'edit-item'}" data-id="${e(item.id)}" data-date="${e(day)}"><h3>${e(c?.shortName||c?.name)}</h3></button>${item.category==='deadline'?`<p class="small muted">${e(item.title)}</p>`:''}<div class="row-meta">${icon(mode.icon,13)}${e(mode.mode==='in-person'?(mode.location||'Location to confirm'):mode.label)}</div></div>${iconButton('chevron','Open details',item.category==='class'?'occurrence':'edit-item',item.id).replace('data-id=',`data-date="${day}" data-id=`)}</div>`;}).join(''):`<div class="card empty">${icon('calendar',27)}<h3>A little breathing room.</h3><p>No scheduled items on this day.</p><button class="text-button" data-action="new-class">Add a class</button></div>`}</div></div>`;
}
function renderSchedule(){const classes=weekClasses();const list=courses();const end=addDays(state.week,6);const weeklabel=formatDate(state.week,{day:'numeric',month:'short'})+' \u2013 '+formatDate(end,{day:'numeric',month:'short',year:'numeric'});const complete=list.map(c=>courseGrade(c,assessments(),tasks()));const done=complete.reduce((n,g)=>n+g.completedCount,0);const count=complete.reduce((n,g)=>n+g.count,0);const percent=count?done/count*100:0;const missingTimes=entities('class').filter(s=>!s.time).length;const review=assessments().filter(a=>a.review||a.due.value&&!a.due.confirmed).length;const upcoming=allItems().filter(x=>!isDone(x)&&x.due?.value&&x.due.precision!=='month'&&(x.due.end||x.due.value)>=today()).sort((a,b)=>a.due.value.localeCompare(b.due.value)).slice(0,3);
  return `${heading('Your week, in focus.','A little less to keep in your head. A little more room to learn.','',profile().term)}<div class="page-tools schedule-tools"><div class="date-navigation"><strong><button data-action="jump-week" aria-label="Choose week">${e(weeklabel)}</button></strong>${iconButton('left','Previous week','previous-week')}${iconButton('chevron','Next week','next-week')}<button class="secondary" data-action="today">Today</button></div><div class="segment" aria-label="Calendar view"><button class="${state.calendarView==='week'?'active':''}" data-action="calendar-view" data-id="week">Week</button><button class="${state.calendarView==='day'?'active':''}" data-action="calendar-view" data-id="day">Day</button></div></div><div class="dashboard-grid"><div class="${state.calendarView==='day'?'day-mode':''}"><div class="mobile-date-strip">${Array.from({length:7},(_,i)=>{const d=addDays(state.week,i);const n=classes.filter(s=>s.date===d).length+allItems().filter(x=>dueOn(x.due,d)).length;return `<button class="day-head ${d===state.day?'selected':''} ${d===today()?'is-today':''}" data-action="select-day" data-id="${d}" aria-label="${e(formatDate(d,{weekday:'long',day:'numeric',month:'long'}))}"><small>${e(formatDate(d,{weekday:'short'}))}</small><span>${calendarDate(d).getDate()}</span><i class="day-event-dot" style="opacity:${n?'.7':'0'}"></i></button>`;}).join('')}</div><div class="week-grid">${Array.from({length:7},(_,i)=>{const d=addDays(state.week,i);const daily=classes.filter(s=>s.date===d).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));const due=allItems().filter(x=>!isDone(x)&&dueOn(x.due,d));return `<div class="day-column ${i>4?'weekend':''} ${d===today()?'today':''}"><button class="day-head" data-action="select-day-desktop" data-id="${d}" aria-label="Show ${e(formatDate(d,{weekday:'long',day:'numeric',month:'long'}))}"><small>${e(formatDate(d,{weekday:'short'}))}</small><span>${calendarDate(d).getDate()}</span></button>${daily.map(s=>renderCalendarEvent(s)).join('')}${due.map(x=>renderCalendarEvent(x,true)).join('')}${daily.length+due.length===0?'<div class="day-empty">&middot;</div>':''}</div>`;}).join('')}</div>${renderAgenda(classes)}<div class="calendar-footnote">${icon('info',14)}<span>All times in ${e(profile().timeZone)}. ${missingTimes?'Some class times are not in your materials yet. Add them in course settings.':'Month-only deadlines stay in Tasks and Exams until a day is known.'}</span></div><div class="legend">${list.slice(0,5).map(c=>`<span class="${colorOf(c)}"><span class="course-dot"></span>${e(c.shortName||c.name)}</span>`).join('')}</div><section class="next-section"><div class="section-title"><h2>On the horizon</h2><button class="text-button" data-action="all-upcoming">All deadlines ${icon('chevron',14)}</button></div><div class="upcoming-cards">${upcoming.length?upcoming.map(x=>{const c=courseById(x.courseId);return `<button class="card upcoming-card ${colorOf(c)}" data-action="edit-item" data-id="${e(x.id)}">${courseLabel(c)}<h3>${e(x.title)}</h3><div class="upcoming-bottom"><span>${e(formatDate(x.due.value))}</span>${x.weight!==undefined?badge(`${x.weight??'?'}%`,'neutral'):badge('Task')}</div></button>`;}).join(''):`<div class="card empty">Your next deadlines will appear here.</div>`}</div></section></div><aside class="dashboard-aside"><section class="card semester-overview"><span class="caption">The semester so far</span><div class="overview-center">${ring(percent,'Completed assessment components',80,'blue')}<div><strong>${done}<span class="muted" style="font-size:16px;font-weight:400"> / ${count}</span></strong><p>components completed</p></div></div><div class="overview-stats"><div><strong>${list.length}</strong><span>Courses</span></div><div><strong>${assessments().filter(x=>x.bucket==='exams'&&!isDone(x)).length}</strong><span>Exams left</span></div><div><strong>${tasks().filter(x=>!isDone(x)).length}</strong><span>Tasks left</span></div></div></section><section class="card notice-card">${icon(review?'alert':'book',22)}<h3>${review?'A few details to confirm.':'Make room for the important things.'}</h3><p>${review?`${review} assessment dates or source details need a second look. Tentative dates are never treated as confirmed deadlines.`:'Start with your course requirements. Your progress will take shape as you complete them.'}</p><button class="text-button" data-action="review-dates">${review?'Review imported details':'Explore courses'} ${icon('arrow',13)}</button></section></aside></div>`;
}
function itemRow(item){const c=courseById(item.courseId);const late=overdue(item,today());return `<div class="list-row ${colorOf(c)} ${isDone(item)?'row-done':''}"><button class="status-check ${e(item.status)}" data-action="toggle-item" data-id="${e(item.id)}" aria-label="${item.status==='graded'?'View grade for':isDone(item)?'Reopen':'Complete'} ${e(item.title)}">${icon(item.status==='submitted'?'clock':'check',16)}</button><div class="row-main"><button class="row-title row-title-button" data-action="edit-item" data-id="${e(item.id)}">${e(item.title)}</button><div class="row-meta">${courseLabel(c)}${item.required?badge('Required','neutral'):''}${item.priority==='high'?badge('High priority','warn','flag'):''}${item.componentId?badge('Linked','neutral','link'):item.weight!==undefined?badge(`${item.weight??'?'}% of grade`):''}${itemDateBadge(item)}<span class="mobile-row-date ${late?'danger':''}">${e(dateLabel(item.due))}</span></div></div><div class="row-right"><span class="date-text ${late?'danger':''}">${e(dateLabel(item.due))}</span>${statusBadge(item)}</div>${iconButton('edit','Edit '+item.title,'edit-item',item.id)}</div>`;}
function renderTasks(){const items=filteredItems('tasks');const month=state.months.tasks;const dated=items.filter(x=>x.due?.value&&(state.dateScope==='all'||inMonth(x.due,month)));const undated=items.filter(x=>!x.due?.value||x.due.precision==='none');return `${heading('Tasks','The small steps. The important work.',`<button class="secondary" data-action="new-task">${icon('plus',16)} Add task</button>`)}<div class="page-tools">${monthTools('tasks')}${filterBar()}</div>${dated.length?`<section class="task-group"><div class="group-label">${state.dateScope==='all'?'All scheduled tasks':e(monthName(month))} &middot; ${dated.length}</div><div class="card">${dated.map(itemRow).join('')}</div></section>`:`<div class="card empty">${icon('checkCircle',28)}<h3>No ${state.dateScope==='all'?'scheduled':'matching'} tasks here.</h3><p>Choose another month or add your next deadline.</p><button class="text-button" data-action="show-all-dates">Show all dates</button></div>`}${undated.length?`<section class="task-group"><div class="group-label">Date not set &middot; ${undated.length}</div><div class="card">${undated.map(itemRow).join('')}</div><p class="calendar-footnote">These items are not assigned an invented deadline.</p></section>`:''}`;}
function examCard(item){const c=courseById(item.courseId);const m=modeData(item,c);const due=item.due||newDue();const hasDay=['day','range'].includes(due.precision)&&due.value;const g=courseGrade(c,assessments(),tasks()).parts.find(x=>x.id===item.id)?.effectiveGrade;return `<article class="card exam-card ${colorOf(c)}"><div class="exam-date"><span>${due.value?e(formatDate(due.value.length===7?due.value+'-01':due.value,{month:'short'})):'DATE'}</span><strong>${hasDay?calendarDate(due.value).getDate():'\u2014'}</strong>${due.precision==='month'?'<p class="exam-month-help">Day TBC</p>':''}</div><div class="exam-content">${courseLabel(c)}<button class="row-title-button" data-action="edit-item" data-id="${e(item.id)}"><h3>${e(item.title)}</h3></button><div class="row-meta">${icon(m.icon,13)}${e(m.mode==='in-person'?(m.location||'Location to confirm'):m.label)}${due.time?' &middot; '+e(due.time):''}</div><div class="exam-details">${badge(item.type,item.type==='Final exam'?'blue':'neutral')}${item.weight!==undefined?badge(`${item.weight??'?'}% of course grade`):''}${itemDateBadge(item)}</div><div class="exam-bottom"><span>${hasGrade(g)?`<strong>${g}</strong> <span class="muted">/ 10</span>`:statusBadge(item)}</span>${iconButton('edit','Edit '+item.title,'edit-item',item.id)}</div></div></article>`;}
function renderExams(){const items=filteredItems('exams');const month=state.months.exams;const scheduled=items.filter(x=>x.due?.value&&(state.dateScope==='all'||inMonth(x.due,month)));const undated=items.filter(x=>!x.due?.value);return `${heading('Exams','The milestones that move your semester forward.',`<button class="secondary" data-action="new-exam">${icon('plus',16)} Add exam</button>`)}<div class="page-tools">${monthTools('exams')}${filterBar()}</div>${scheduled.length?`<div class="group-label">${state.dateScope==='all'?'All scheduled exams':e(monthName(month))}</div><div class="exam-grid">${scheduled.map(examCard).join('')}</div>`:`<div class="card empty">${icon('cap',30)}<h3>No exams in this view.</h3><p>Your upcoming midterms and finals have their own space here.</p><button class="text-button" data-action="next-exam-month">Go to the next exam ${icon('arrow',14)}</button></div>`}${undated.length?`<div class="group-label">Dates to be announced &middot; ${undated.length}</div><div class="exam-grid">${undated.map(examCard).join('')}</div>`:''}`;}
function renderCourses(){return `${heading('Your courses','Different subjects. One clear picture.',`<button class="secondary" data-action="templates">${icon('download',16)} Import templates</button>`)}<div class="courses-grid">${courses().map(c=>{const g=courseGrade(c,assessments(),tasks());return `<button class="card course-card ${colorOf(c)}" data-action="course" data-id="${e(c.id)}"><div class="course-card-top">${courseGlyph(c,22)}${c.review?badge('Needs review','warn'):c.credits?badge(`${c.credits} ECTS`):icon('chevron',17)}</div><h2>${e(c.shortName||c.name)}</h2><p>${e(c.lecturer||c.code||'Add class times and course details')}</p><div class="progress-track"><span style="width:${Math.min(100,g.valid?g.completedWeight:g.count?g.completedCount/g.count*100:0)}%"></span></div><div class="course-card-stats"><span>${g.completedCount} of ${g.count} components complete</span><span>${g.valid?Math.round(g.completedWeight)+'%':g.count?'Check weights':'Set up plan'}</span></div><div class="course-card-bottom"><span>Current average</span><strong>${g.current===null?'\u2014':g.current.toFixed(2)}<small class="muted" style="font-weight:400;font-size:10px"> / 10</small></strong></div></button>`;}).join('')}<button class="add-course-card" data-action="new-course">${icon('plus',28)}<span>Add a course</span></button></div>`;}
function componentRow(part,c){return `<div class="component-row ${colorOf(c)}"><button class="status-check ${part.completed?'completed':e(part.status)}" data-action="edit-item" data-id="${e(part.id)}" aria-label="Open ${e(part.title)}">${icon('check',14)}</button><div class="row-main"><button class="row-title row-title-button" data-action="edit-item" data-id="${e(part.id)}">${e(part.title)}</button><div class="row-meta">${e(part.type)}${part.due?.value?' &middot; '+e(dateLabel(part.due)):''}${part.aggregation==='average'?`<span>${part.gradedChildren}/${part.expected||'?'} activities graded</span>`:''}</div></div><span class="row-weight">${part.weight??'?'}%</span><span class="component-grade">${part.effectiveGrade===null?'\u2014':round(part.effectiveGrade)}${part.effectiveGrade!==null?'<small>/10</small>':''}</span>${iconButton('edit','Edit '+part.title,'edit-item',part.id)}</div>`;}
function renderCourse(){const c=courseById(state.courseId);if(!c)return `${heading('Course not found','This course may be in Trash.')}<button class="secondary" data-action="navigate" data-id="courses">Back to courses</button>`;const g=courseGrade(c,assessments(),tasks());const cls=entities('class').filter(x=>x.courseId===c.id);const courseTasks=tasks().filter(x=>x.courseId===c.id);const mode=modeData({},c);const weightsWarning=!g.valid?`<div class="notice-strip">${icon('alert',17)}<div><strong>${g.count?'Assessment weights need attention.':'Build your assessment plan.'}</strong><br>${g.count?`Weights total ${g.totalWeight}%. Forecasts stay hidden until all components total 100%.`:'Add your exams, assignments and their share of the final grade.'}</div></div>`:'';
 return `<button class="back-link" data-action="navigate" data-id="courses">${icon('left',15)} Courses</button><div class="page-heading"><div class="course-hero">${courseGlyph(c,28)}<div><h1>${e(c.name)}</h1><p>${e([c.code,c.credits?c.credits+' ECTS':'',profile().term].filter(Boolean).join(' \u00b7 '))}</p></div></div>${iconButton('edit','Edit course','edit-course',c.id,'raised')}</div>${c.review?`<div class="notice-strip">${icon('alert',17)}<div><strong>Imported details need review.</strong> Source notes explain any missing details or conflicting versions. Confirm dates in Moodle before treating them as final.</div></div>`:''}<div class="metrics"><div class="card metric"><span>Current average</span><strong>${g.current===null?'\u2014':g.current.toFixed(2)}<small>/ 10</small></strong><p>Only graded components</p></div><div class="card metric"><span>Secured points</span><strong>${g.secured.toFixed(2)}<small>/ 10</small></strong><p>Already earned toward the total</p></div><div class="card metric"><span>Assessed weight</span><strong>${g.gradedWeight}<small>%</small></strong><p>${g.remainingWeight}% awaiting grades</p></div></div><div class="course-detail-grid"><div>${weightsWarning}<section class="card"><div class="card-head"><h2>Assessment plan</h2><button class="text-button" data-action="new-component" data-id="${c.id}">${icon('plus',16)} Add</button></div>${g.count?`<div class="assessment-weight-bar ${colorOf(c)}" aria-label="${g.completedWeight}% of course weight completed">${g.parts.map(p=>`<span class="${p.completed?'done':''}" style="width:${Math.max(0,Math.min(100,p.weight||0))}%" title="${e(p.title)}: ${p.weight}%"></span>`).join('')}</div>${g.parts.map(p=>componentRow(p,c)).join('')}`:`<div class="empty">Add components to see what is left to complete.</div>`}<div class="grade-note">${g.completedCount} of ${g.count} complete. Submitted work awaiting a result stays separate. A completed plan is not proof of passing any additional course requirements.</div></section><section class="next-section"><div class="section-title"><h2>Tasks &amp; milestones</h2><button class="text-button" data-action="new-course-task" data-id="${c.id}">${icon('plus',15)} Add</button></div><div class="card">${courseTasks.length?courseTasks.map(itemRow).join(''):`<div class="empty"><p>Break a bigger assessment into smaller steps.<br>Linked tasks never count the same weight twice.</p></div>`}</div></section><section class="next-section"><div class="section-title"><h2>Class schedule</h2><button class="text-button" data-action="new-class" data-id="${c.id}">${icon('plus',15)} Add</button></div><div class="card">${cls.length?cls.map(s=>`<div class="list-row"><div class="row-main"><div class="row-title">${e(s.title||'Class')}</div><div class="row-meta">${e((s.days||[]).map(d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join(', '))} &middot; ${e(s.time?s.time+' \u2013 '+(s.endTime||''):'Time to confirm')}${s.interval===2?' &middot; Every other week':''}</div><div class="row-meta">${e(formatDate(s.startDate))} &ndash; ${e(formatDate(s.endDate))}</div></div>${iconButton('edit','Edit class schedule','edit-class',s.id)}</div>`).join(''):`<div class="empty">No class times supplied yet. Add your timetable here.</div>`}</div></section></div><aside class="course-aside"><section class="card"><div class="card-head"><h2>Where you could finish</h2></div><div class="card-body"><p>Scenario, not an official grade. Assume this average for the remaining ${g.remainingWeight}%.</p>${field('Remaining-work average (0-10)','futureGrade',g.assumed,'number',`min="0" max="10" step="0.1" data-course-forecast="${c.id}"`)}<div class="overview-stats"><div><strong>${g.projected===null?'\u2014':g.projected.toFixed(2)}</strong><span>Projected / 10</span></div><div><strong>${g.maximum===null?'\u2014':g.maximum.toFixed(2)}</strong><span>Maximum / 10</span></div></div>${hasGrade(c.targetGrade)&&g.valid?`<p style="margin-top:15px">To finish with ${c.targetGrade}/10: ${g.remainingWeight>0?(c.targetGrade-g.secured)/(g.remainingWeight/100)>10?'the target is no longer reachable from the remaining weight.':`average at least ${Math.max(0,(c.targetGrade-g.secured)/(g.remainingWeight/100)).toFixed(2)}/10 on remaining work.`:g.final>=c.targetGrade?'target reached.':'all weight has been graded.'}</p>`:''}${hasGrade(c.officialGrade)?`<div class="notice-strip">Official course grade: ${c.officialGrade}/10</div>`:''}</div></section><section class="card"><div class="card-head"><h2>Course details</h2></div><div class="card-body"><div class="detail-line">${icon(mode.icon,17)}<span>${e(mode.label)}${mode.location?'<br>'+e(mode.location):''}</span></div>${c.lecturer?`<div class="detail-line">${icon('cap',17)}<span>${e(c.lecturer)}</span></div>`:''}${c.email?`<p style="overflow-wrap:anywhere"><a href="mailto:${e(c.email)}">${e(c.email)}</a></p>`:''}<div class="button-row" style="margin-top:15px">${externalLink(c.moodleUrl,'Moodle')}${externalLink(c.meetingUrl,'Join online','video')}</div>${c.passMark!==null&&c.passMark!==undefined?`<p style="margin-top:15px">Configured pass mark: ${c.passMark}/10. Check additional requirements in the notes.</p>`:''}<button class="text-button" data-action="edit-course" data-id="${c.id}" style="margin-top:8px">${icon('edit',14)} Course settings</button></div></section><section class="card"><div class="card-head"><h2>Notes &amp; sources</h2>${iconButton('edit','Edit course notes','edit-course',c.id)}</div><div class="card-body source-box"><p>${e(c.notes||'Add your notes in course settings.')}</p>${c.source?`<details><summary>Source material</summary><p>${e(c.source)}</p></details>`:''}</div></section></aside></div>`;

rade-state">${statusBadge(p)}</span>${iconButton('edit','Edit '+p.title,'edit-item',p.id)}</td></tr>`).join('')||'<tr><td colspan="4">No assessment components yet.</td></tr>'}</tbody></table></div><div class="grade-note">${g.final!==null?`Calculated final: <strong>${g.final}/10</strong>. `:''}${hasGrade(c.officialGrade)?`Official grade: <strong>${c.officialGrade}/10</strong>. `:'No official course grade entered. '}<button class="text-link" data-action="edit-course" data-id="${c.id}">Set official grade ${icon('edit',12)}</button></div></section>`;}).join('')||'<div class="card empty">Add a course to start your gradebook.</div>'}`;}

// Editors use stable record IDs and a mutation token, so an open form cannot

function requireCourse(){if(courses().length)return true;notify('Add a course first.');openCourse();return false;}
function courseOptions(){return courses().map(c=>[c.id,c.name]);}
function dateFields(due=newDue()){
  const value=due.value||'';
  return `<div class="form-section"><h3>Date &amp; time</h3>${select('How precise is the date?','precision',due.precision,[['none','Not announced'],['month','Month only'],['day','Exact day'],['range','Date range']])}<div data-date-fields="month">${field('Month','dueMonth',value.slice(0,7),'month')}</div><div class="form-grid" data-date-fields="day range">${field('Date','dueDate',value.length===10?value:'','date')}<div data-date-fields="range">${field('Through','dueEnd',due.end||'','date')}</div>${field('Time (optional)','dueTime',due.time||'','time')}</div>${toggle('Date confirmed','confirmed',due.confirmed!==false,'Unconfirmed dates are shown as tentative, never as overdue.')}</div>`;
}
function updateDateFields(form){const precision=form.elements.precision?.value;if(!precision)return;form.querySelectorAll('[data-date-fields]').forEach(el=>{el.hidden=!el.dataset.dateFields.split(' ').includes(precision);});}
function collectDue(fd){const precision=fd.get('precision');return {precision,value:precision==='none'?'':String(fd.get(precision==='month'?'dueMonth':'dueDate')||''),end:precision==='range'?String(fd.get('dueEnd')||''):'',time:['day','range'].includes(precision)?String(fd.get('dueTime')||''):'',confirmed:fd.has('confirmed')};}
function locationFields(item){return `<div class="form-section"><h3>Where</h3>${select('Format','mode',item.mode||'default',MODES)}<div class="form-grid">${field('Location override (optional)','location',item.location||'')}${field('Meeting link override (optional)','meetingUrl',item.meetingUrl||'','url')}</div><p class="field-help">Empty overrides inherit the course location or online link.</p></div>`;}
function updateComponentOptions(form){const courseId=form.elements.courseId?.value;const target=form.elements.componentId;if(target){const old=target.value;target.innerHTML=`<option value="">No grading component</option>${assessments().filter(a=>a.courseId===courseId).map(a=>`<option value="${e(a.id)}">${e(a.title)} (${a.weight??'?'}%)</option>`).join('')}`;target.value=Array.from(target.options).some(o=>o.value===old)?old:'';}}

  const body=`${field('Title','title',item.title,'text','required maxlength="200"')}${select('Course','courseId',item.courseId,courseOptions(),'required')}<div class="form-grid">${select('Type','type',item.type,TYPES)}${select('Section','bucket',item.bucket||'tasks',[['tasks','Tasks'],['exams','Exams']])}</div>${isAssessment?`<div class="form-section"><h3>Assessment component</h3><div class="form-grid">${field('Weight in the final grade (%)','weight',item.weight??'','number','min="0" max="100" step="0.01" inputmode="decimal"')}${select('How is the grade calculated?','aggregation',item.aggregation||'manual',[['manual','Enter official grade manually'],['average','Average of linked task grades']])}</div>${field('Expected linked activities (optional)','expectedCount',item.expectedCount??'','number','min="1" max="500" step="1"')}<p class="field-help">Only assessment components contribute weight to the course. A linked-task average counts once all expected activities are graded. Confirm the aggregation rule with your lecturer.</p></div>`:`${select('Link to grading component (optional)','componentId',item.componentId||'',[['','No grading component'],...assessments().filter(a=>a.courseId===item.courseId).map(a=>[a.id,`${a.title} (${a.weight??'?'}%)`])])}<p class="field-help">Link a task to a component without counting its weight twice. Use an assessment component for work with its own share of the final grade.</p>`}${dateFields(item.due)}<div class="form-section"><h3>Progress &amp; result</h3><div class="form-grid">${select('Status','status',item.status,STATUSES.map(s=>[s,STATUS_LABEL[s]]))}${field('Awarded grade / 10 (optional)','grade',item.grade??'','number','min="0" max="10" step="0.01" inputmode="decimal"')}</div>${isAssessment?'<p class="field-help">For an average-based component, enter grades on the linked tasks instead. The component result is calculated automatically.</p>':''}${toggle('Required','required',item.required,'Keep essential course requirements easy to spot.')}${select('Priority','priority',item.priority||'normal',[['normal','Normal'],['high','High'],['low','Low']])}</div>${locationFields(item)}<div class="form-section"><h3>Notes</h3>${textarea('Details, rubric or preparation notes','notes',item.notes||'')}${toggle('Needs review','review',item.review,'Keep this flag until source conflicts or requirements are resolved.')}<details><summary>Source &amp; provenance</summary>${textarea('Source notes','source',item.source||'')}</details></div>${!existing&&!isAssessment?`<details class="form-section"><summary>Repeat this task</summary><p class="field-help">Creates separate editable tasks from an exact first date. Use the actual due day, not the release day.</p><div class="form-grid">${field('Number of tasks','repeatCount',1,'number','min="1" max="100" step="1"')}${select('Repeat every','repeatInterval','7',[['7','Week'],['14','Two weeks']])}</div></details>`:''}`;
  openModal({title:existing?'Edit '+(isAssessment?'assessment':'task'):'New '+(isAssessment?'assessment':'task'),subtitle:isAssessment?'A component of your final course grade.':'A clear next step.',body,wide:true,footer:existing?`${iconButton('trash','Delete this item','delete-record',id,'danger')}${iconButton('copy','Duplicate this item','duplicate-record',id)}`:'',afterOpen:form=>{updateDateFields(form);form.elements.precision.onchange=()=>updateDateFields(form);form.elements.courseId.onchange=()=>updateComponentOptions(form);},submit:async fd=>{

    if(isAssessment){data.weight=numberOrNull(fd.get('weight'));data.aggregation=String(fd.get('aggregation'));data.expectedCount=numberOrNull(fd.get('expectedCount'));if(data.aggregation==='average')data.grade=null;}
    else data.componentId=String(fd.get('componentId')||'');
    if(hasGrade(data.grade))data.status='graded';else if(existing&&hasGrade(item.grade)&&data.status==='graded'&&data.aggregation!=='average')data.status='submitted';
    if(!courseById(data.courseId))throw new Error('This course is no longer available.');
    if(data.componentId&&!assessments().some(a=>a.id===data.componentId&&a.courseId===data.courseId))throw new Error('Choose a component from the selected course.');
    const count=!existing&&!isAssessment?Number(fd.get('repeatCount')||1):1;
    if(!Number.isInteger(count)||count<1||count>100)throw new Error('Choose between 1 and 100 tasks.');

    await store.putMany(updates);notify(count>1?`${count} tasks saved.`:'Saved.');
  }});
}

async function applyUpdate(){
  if(modalState?.dirty){notify('Save or close your open form before updating.',true);return;}
  // A read transaction waits for earlier writes before allowing a page reload.
  if(store.database)await idbComplete(store.database.transaction('workspaces','readonly'));
  const worker=state.sw?.waiting;
  if(worker){worker.postMessage({type:'SKIP_WAITING'});}
  else if(state.reloadReady){location.reload();}
  else notify('No waiting update.');
}

async function handleAction(action,id,button){
  switch(action){
    case 'retry-boot':location.reload();break;
    case 'navigate':chooseView(id);break;
    case 'course':chooseView('course',id);break;
    case 'new-menu':openNewMenu();break;
    case 'new-course':openCourse();break;
    case 'edit-course':openCourse(id);break;
    case 'templates':openTemplates();break;
    case 'new-task':openItem('','task','tasks',state.courseFilter==='all'?'':state.courseFilter);break;
    case 'new-assessment':openItem('','assessment','tasks',state.courseFilter==='all'?'':state.courseFilter);break;
    case 'new-exam':openItem('','assessment','exams',state.courseFilter==='all'?'':state.courseFilter);break;
    case 'new-component':openItem('','assessment','tasks',id||state.courseId);break;
    case 'new-course-task':openItem('','task','tasks',id||state.courseId);break;
    case 'edit-item':openItem(id);break;
    case 'toggle-item':await toggleItem(id);break;
    case 'delete-record':await deleteRecord(id);break;
    case 'duplicate-record':await duplicateRecord(id);break;
    case 'restore-record':await store.restoreItem(id);closeModal(true);openTrash();notify('Restored.');break;
    case 'new-class':openClass('',id||state.courseId);break;
    case 'edit-class':openClass(id);break;
    case 'occurrence':openOccurrence(id,button.dataset.date);break;
    case 'reset-exception':{if(!confirm('Remove this individual change and use the series defaults?'))break;const r=store.envelope(id);const data=copy(r.data);delete data.exceptions[button.dataset.date];await store.put('class',data,recordToken(r));closeModal(true);openClass(id);break;}
    case 'edit-profile':openProfile();break;
    case 'toggle-transparency':await setProfilePatch({reducedTransparency:!profile().reducedTransparency});break;
    case 'previous-week':state.week=addDays(state.week,-7);state.day=addDays(state.day,-7);renderApp(true);break;
    case 'next-week':state.week=addDays(state.week,7);state.day=addDays(state.day,7);renderApp(true);break;
    case 'today':state.day=today();state.week=weekStart(today());renderApp(true);break;
    case 'select-day':state.day=id;renderApp(true);break;
    case 'select-day-desktop':state.day=id;state.calendarView='day';renderApp(true);break;
    case 'calendar-view':state.calendarView=id;renderApp(true);break;
    case 'jump-week':chooseDateDialog();break;
    case 'previous-month':state.months[state.view]=shiftMonth(state.months[state.view],-1);state.dateScope='month';renderApp(true);break;
    case 'next-month':state.months[state.view]=shiftMonth(state.months[state.view],1);state.dateScope='month';renderApp(true);break;
    case 'this-month':state.months[state.view]=today().slice(0,7);state.dateScope='month';renderApp(true);break;
    case 'jump-month':chooseDateDialog(true);break;
    case 'show-all-dates':state.dateScope='all';renderApp(true);break;
    case 'next-exam-month':{const next=filteredItems('exams').find(x=>x.due?.value>=today().slice(0,7));if(next){state.months.exams=next.due.value.slice(0,7);state.dateScope='month';}else state.dateScope='all';renderApp(true);break;}
    case 'all-upcoming':state.dateScope='all';state.statusFilter='open';chooseView('tasks');break;
    case 'review-dates':chooseView('courses');break;
    case 'search':openSearch();break;
    case 'search-open':{closeModal(true);if(itemKind(id)==='course')chooseView('course',id);else openItem(id);break;}
    case 'close-modal':closeModal();break;
    case 'sync-now':await sync.run();renderApp(true);break;
    case 'retry-cloud':await initialCloudLoad();renderApp(true);break;
    case 'conflicts':openConflicts();break;
    case 'resolve-local':case 'resolve-cloud':await store.resolve(id,action==='resolve-local');closeModal(true);openConflicts();break;
    case 'sign-in':await openSignIn();break;
    case 'sign-out':if(store.pending.length&& !confirm('Some changes are only on this device. Sign out anyway? They will remain in this device\'s account cache.'))break;await cloud.signOut();await store.load('local');state.allowLocal=false;state.cloudInitialBlocked=false;sync.lastSync=null;sync.status='Local only';renderApp(true);break;
    case 'local-mode':state.allowLocal=true;state.cloudInitialBlocked=false;await store.load('local');sync.status='Local only';renderApp(true);break;
    case 'forgot-password':openResetPassword();break;
    case 'export':downloadFile(JSON.stringify(store.export(),null,2),`education-backup-${today()}.json`);notify('Backup exported. Keep it somewhere safe.');break;
    case 'import':document.getElementById('backup-file').click();break;
    case 'recovery':await exportRecovery();break;
    case 'trash':openTrash();break;
    case 'check-update':if(state.sw){await state.sw.update();notify(state.sw.waiting?'An update is ready. Use the update banner.':'Update check complete.');}else notify('Install the hosted HTTPS version to receive app updates.');break;
    case 'apply-update':await applyUpdate();break;
    case 'dismiss-update':document.getElementById('update-banner').hidden=true;break;
    default:console.warn('Unknown action:',action);
  }
}

async function registerWorker(){
  if(config.singleFile||!('serviceWorker' in navigator)||!['http:','https:'].includes(location.protocol))return;
  let controlled=!!navigator.serviceWorker.controller;
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',async()=>{
    if(!controlled){controlled=true;return;}
    if(reloading)return;
    state.reloadReady=true;
    if(modalState?.dirty||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){showUpdate();return;}
    try{if(store.database)await idbComplete(store.database.transaction('workspaces','readonly'));}
    catch{showUpdate();return;}
    reloading=true;location.reload();
  });
  try{
    const registration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
    state.sw=registration;
    if(registration.waiting)showUpdate();
    registration.addEventListener('updatefound',()=>{
      const worker=registration.installing;
      worker?.addEventListener('statechange',()=>{
        if(worker.state==='installed'&&navigator.serviceWorker.controller)showUpdate();
      });
    });
  }catch(error){console.warn('Service worker unavailable:',error.message);}
}
async function boot(){
  try{await store.init();const recovered=cloud.configured?await cloud.acceptRecovery():false;await store.load(cloud.user?.id||'local');if(cloud.user)await initialCloudLoad();state.loading=false;const path=location.hash.replace(/^#\//,'').split('/');if([...NAV.map(n=>n[0]),'course','settings'].includes(path[0])){state.view=path[0];state.courseId=path[1]||'';}state.day=today();state.week=weekStart(today());store.subscribe(()=>{renderApp();if(store.account!=='local'&&store.pending.length&&!sync.running)sync.schedule();});renderApp(true);registerWorker();if(recovered)openNewPassword();}
  catch(error){state.loading=false;root.innerHTML=`<div class="welcome"><section class="card welcome-panel"><h1>Your data comes first.</h1><p>Education could not open its storage.</p><p class="danger">${e(error.message)}</p><p>Use a regular browser window with storage enabled. Keep your backup safe; this screen has not erased any saved records.</p><button class="primary" data-action="retry-boot">Try again</button></section></div>`;console.error(error);}
}
boot();

</script>
</body>
